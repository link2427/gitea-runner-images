version: 2
updates:
  # Toolchain majors are part of each image's contract (node-22, dotnet-8, ...),
  # so only minor and patch updates are proposed. New majors get new images.
  - package-ecosystem: docker
    directories: [/images/base, /images/dotnet8]
    schedule:
      interval: weekly
    ignore:
      - dependency-name: "*"
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
