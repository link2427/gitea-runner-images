name: Complete offline v0.1.0 package
'on':
  push:
    branches:
    - main
    paths:
    - .github/workflows/offline-v0.1.0.yml
permissions:
  contents: write
concurrency:
  group: release-v0.1.0
  cancel-in-progress: false
jobs:
  package:
    if: 'github.event.head_commit.message == ''release: complete offline v0.1.0 bundle'''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
    - name: Package controller and existing job images
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
      run: |
        set -euo pipefail
        mkdir -p dist setup/images bundle
        gh release download v0.1.0 --dir dist --pattern SHA256SUMS --pattern manifest.json
        mv dist/SHA256SUMS dist/original-SHA256SUMS
        for name in runner-base runner-python311 runner-cpp runner-dotnet8 runner-node22; do
          gh release download v0.1.0 --dir dist --pattern "$name-0.1.0.tar.zst"
        done
        (cd dist && sha256sum --check --ignore-missing original-SHA256SUMS)
        for name in runner-base runner-python311 runner-cpp runner-dotnet8 runner-node22; do
          zstd -d -q -k "dist/$name-0.1.0.tar.zst"
        done
        (cd dist && sha256sum --check --ignore-missing original-SHA256SUMS)
        docker pull --platform linux/amd64 docker.io/gitea/runner:2
        docker run --rm --network none --entrypoint gitea-runner docker.io/gitea/runner:2 bug-report
        docker run --rm --network none --entrypoint gitea-runner docker.io/gitea/runner:2 generate-config > /tmp/upstream-runner-config.yaml
        docker save -o dist/gitea-runner.tar docker.io/gitea/runner:2
        zstd --threads=0 --quiet -6 --keep dist/gitea-runner.tar
        docker image inspect docker.io/gitea/runner:2 > /tmp/controller-inspect.json
        (cd dist && sha256sum gitea-runner.tar gitea-runner.tar.zst > GITEA-RUNNER-SHA256SUMS)
        gh release upload v0.1.0 dist/gitea-runner.tar dist/gitea-runner.tar.zst dist/GITEA-RUNNER-SHA256SUMS --clobber
        python3 <<'PY'
        import json,pathlib,hashlib,os
        files=json.loads(r'''{"compose.yaml":"services:\n  runner:\n    image: docker.io/gitea/runner:2\n    pull_policy: never\n    restart: unless-stopped\n    environment:\n      CONFIG_FILE: /config.yaml\n      GITEA_INSTANCE_URL: ${GITEA_INSTANCE_URL:?Set GITEA_INSTANCE_URL in .env}\n      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_REGISTRATION_TOKEN:?Set registration token in .env}\n      GITEA_RUNNER_NAME: offline-runner\n    volumes:\n      - ./config.yaml:/config.yaml:ro\n      - ./data:/data\n      - /var/run/docker.sock:/var/run/docker.sock\n","config.yaml":"log:\n  level: info\nrunner:\n  file: /data/.runner\n  capacity: 1\n  labels:\n    - \"ubuntu-latest:docker://runner-base:0.1.0\"\n    - \"python-3.11:docker://runner-python311:0.1.0\"\n    - \"cpp:docker://runner-cpp:0.1.0\"\n    - \"dotnet-8:docker://runner-dotnet8:0.1.0\"\n    - \"node-22:docker://runner-node22:0.1.0\"\ncache:\n  enabled: false\ncontainer:\n  privileged: false\n  valid_volumes: []\n  docker_host: \"-\"\n  force_pull: false\n  force_rebuild: false\n",".env.example":"GITEA_INSTANCE_URL=http://YOUR-GITEA-HOST:3000\nGITEA_RUNNER_REGISTRATION_TOKEN=REPLACE_LOCALLY\n","load-and-start.ps1":"$ErrorActionPreference = \"Stop\"\nSet-Location $PSScriptRoot\nif (-not (Test-Path \".env\")) { throw \"Copy .env.example to .env and fill in your Gitea URL and registration token first.\" }\nGet-Content SHA256SUMS | ForEach-Object {\n    if ($_ -match '^([a-fA-F0-9]{64})\\s+\\*?(.+)$') {\n        $expected = $Matches[1]; $path = $Matches[2]\n        $actual = (Get-FileHash -Algorithm SHA256 $path).Hash\n        if ($actual -ne $expected) { throw \"Checksum mismatch: $path\" }\n    }\n}\nNew-Item -ItemType Directory -Force data | Out-Null\nGet-ChildItem .\\images\\*.tar | ForEach-Object {\n    docker load --input $_.FullName\n    if ($LASTEXITCODE -ne 0) { throw \"Failed to load $($_.Name)\" }\n}\ndocker compose config --quiet\nif ($LASTEXITCODE -ne 0) { throw \"Invalid Compose configuration\" }\ndocker compose up -d\nif ($LASTEXITCODE -ne 0) { throw \"Runner startup failed\" }\n","README.txt":"OFFLINE GITEA RUNNER SETUP (linux/amd64)\n\nThis bundle includes the controller AND all five job images as plain Docker .tar files.\nThe DOWNLOAD machine needs only a browser and ZIP extraction. Docker is required only on the TARGET host.\n\n1. Extract this ZIP on the target Docker host (Linux containers).\n2. Copy .env.example to .env. Enter a Gitea URL reachable from containers and a registration token from Gitea Settings > Actions > Runners. Never use localhost for a remote Gitea server.\n3. On Windows PowerShell: .\\load-and-start.ps1\n   If organizational execution policy blocks scripts, do not bypass it; verify checksums, docker load each images/*.tar and run docker compose up -d manually.\n4. Future startup: docker compose up -d\n\nOn Linux: verify with sha256sum -c SHA256SUMS; run for f in images/*.tar; do docker load -i \"$f\" || exit; done; then docker compose up -d.\n\nUse the same Docker daemon/context for loading and Compose. Gitea must be reachable from both controller and jobs. A Gitea-only Docker service hostname requires attaching controller and jobs to that actual network.\n\nWorkflow labels: ubuntu-latest (Debian base), python-3.11, cpp, dotnet-8, node-22.\ncapacity: 1 means one concurrent job. Jobs launch their selected image as needed.\n\nThe Docker socket gives the controller host-level control. Use only trusted workflows. Keep .env and data/.runner private.\nThis bundle does not include an existing Gitea server, Docker itself, third-party action repositories, application dependencies or service images; mirror/vendor those separately for offline builds.\n\nJob images are unchanged v0.1.0 release assets. The added controller's digest, image ID and packaging source commit are recorded in offline-manifest.json.\n"}''')
        dist=pathlib.Path("dist"); setup=pathlib.Path("setup")
        for name,content in files.items():
            (setup/name).write_text(content)
        record=json.loads(pathlib.Path("/tmp/controller-inspect.json").read_text())[0]
        assert record["Os"]=="linux" and record["Architecture"]=="amd64"
        entry={"name":"gitea-runner","tag":"docker.io/gitea/runner:2","image_id":record["Id"],"repo_digests":record.get("RepoDigests",[]),"architecture":record["Architecture"],"os":record["Os"],"role":"controller","files":[]}
        for suffix in (".tar",".tar.zst"):
            p=dist/("gitea-runner"+suffix)
            with p.open("rb") as f: digest=hashlib.file_digest(f,"sha256").hexdigest()
            entry["files"].append({"name":p.name,"bytes":p.stat().st_size,"sha256":digest})
        manifest=json.loads((dist/"manifest.json").read_text())
        manifest["images"]=[x for x in manifest["images"] if x["name"]!="gitea-runner"]+[entry]
        manifest["offline_packaging_commit"]=os.environ["GITHUB_SHA"]
        (dist/"manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
        (setup/"offline-manifest.json").write_text(json.dumps(manifest,indent=2)+"\n")
        PY
        cp dist/*.tar setup/images/
        cp setup/.env.example setup/.env
        GITEA_INSTANCE_URL=http://gitea.invalid:3000 GITEA_RUNNER_REGISTRATION_TOKEN=validation-placeholder docker compose -f setup/compose.yaml config --quiet
        rm setup/.env
        (cd setup && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS)
        (cd setup && zip -q -r ../dist/gitea-offline-0.1.0.zip .)
        unzip -tq dist/gitea-offline-0.1.0.zip
        cp dist/*.tar.zst dist/manifest.json bundle/
        (cd bundle && find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 sha256sum > SHA256SUMS && sha256sum -c SHA256SUMS && tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner -cf - . | zstd --threads=0 --quiet -6 -o ../dist/runner-images-0.1.0.tar.zst)
        rm dist/original-SHA256SUMS
        (cd dist && sha256sum *.tar *.tar.zst *.zip manifest.json GITEA-RUNNER-SHA256SUMS > SHA256SUMS && sha256sum -c SHA256SUMS)
        python3 - <<'PY'
        from pathlib import Path
        for p in Path("dist").iterdir():
            assert p.stat().st_size < 2*1024**3, f"GitHub asset too large: {p}"
        PY
        gh release upload v0.1.0 dist/manifest.json dist/runner-images-0.1.0.tar.zst dist/gitea-offline-0.1.0.zip --clobber
        gh release upload v0.1.0 dist/SHA256SUMS --clobber

