name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to (re)build, for example v1.0.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag || github.ref_name }}
          persist-credentials: false
      - name: Check tag
        id: version
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be vX.Y.Z, got: $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - name: Validate repository
        run: ./scripts/validate.sh
      - name: Build, smoke-test and package every image
        env:
          REVISION: ${{ github.sha }}
        run: ./scripts/release.sh "${{ steps.version.outputs.version }}"
      - name: Install the bundle and run tests/airgap without internet
        env:
          AIRGAP: "1"
        run: ./scripts/test-bundle.sh "dist/gitea-offline-${{ steps.version.outputs.version }}.tar"
      - name: Write release notes
        run: |
          {
            echo "Download **gitea-offline-${{ steps.version.outputs.version }}.tar**: it is the only file you need to burn."
            echo "Verify it with \`sha256sum -c SHA256SUMS\`, extract it on the air-gapped host and follow its README.md."
            echo
            echo "This bundle passed an end-to-end test with all container internet access blocked."
            echo
            echo "| runs-on | Image | Toolchains |"
            echo "| --- | --- | --- |"
            jq -r '.job_images[] | "| \(.labels | join(", ")) | `\(.tag)` | \(.toolchains | join(", ")) |"' dist/manifest.json
            echo
            jq -r '"Controller: `\(.controller.tag)` (\(.controller.repo_digests[0] // .controller.image_id))"' dist/manifest.json
            echo
            echo "Bundled actions (default branch plus every tag):"
            jq -r '.actions[] | "- `\(.repo)` (\(.tags) tags)"' dist/manifest.json
          } > release-notes.md
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          assets=("dist/gitea-offline-$VERSION.tar" dist/SHA256SUMS dist/manifest.json)
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" --verify-tag \
              --title "Gitea offline runner $RELEASE_TAG" --notes-file release-notes.md
          fi
